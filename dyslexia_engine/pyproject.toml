[project]
name = "dyslexia-engine"
version = "0.1.0"
description = "Dyslexia adaptation engine and model layer (import name: app)"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.0",
    "beautifulsoup4>=4.12",
    "pydantic>=2.0",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
