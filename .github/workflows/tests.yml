name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install backend + engines
        working-directory: backend
        run: uv sync --locked

      - name: Run all test suites (mock model, no key needed)
        working-directory: backend
        env:
          MODEL_MOCK: "1"
        run: uv run pytest test_main.py ../dyslexia_engine ../accessibility_engine/tests
